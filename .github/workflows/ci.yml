# CVER OSS shared delivery baseline — Node CI template (dim 7).
#
# Vendored per-repo as `.github/workflows/ci.yml`. Designed to be portable across
# the heterogeneous CVER Node repos with minimal per-repo edits:
#
#   - RUNNER: ubuntu-latest by default. Switch to macos-latest for repos that build
#     native macOS code (Swift/Vision) — e.g. reepub. Use a matrix for cross-platform.
#   - INSTALL: handles repos with and without a lockfile (npm ci vs npm install).
#   - TEST/BUILD: `--if-present` / a guarded build so a repo missing either script is
#     still green — and the Build step says "no build script" instead of a silent ✓.
#   - READINESS: the shared version + artifact-hygiene gate (single source of truth).
#
# The only line most repos need to change is `runs-on`.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"] # so the release-tag check in check-release-readiness.mjs actually runs
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest # macos-latest for native-macOS repos (reepub)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Test
        run: npm test --if-present

      - name: Build
        run: |
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          else
            echo "::notice::no build script in package.json; build skipped"
          fi

      - name: Release readiness
        run: node scripts/check-release-readiness.mjs
